name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Tokens, lint, colours, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm run sync
      - name: Assemble, lint
        working-directory: android
        run: ./gradlew assembleDebug lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: rosetta-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-smoke:
    name: Android emulator smoke test
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: rosetta-debug-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, and check the app stays up
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app-debug.apk
            adb shell am start -W -n io.github.notmehul.rosetta/.MainActivity
            sleep 15
            adb shell pidof io.github.notmehul.rosetta
            adb shell am start -W -a android.intent.action.VIEW -d 'rosetta://open?title=Guide' io.github.notmehul.rosetta
            sleep 5
            adb shell pidof io.github.notmehul.rosetta
            adb exec-out screencap -p > smoke.png
            ! adb logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime: Process: io.github.notmehul.rosetta'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: Build for the simulator
        shell: bash # -eo pipefail, so a failed xcodebuild fails the step
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
